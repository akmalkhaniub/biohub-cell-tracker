services:
  biohub-cell-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: biohub-cell-tracker:latest
    container_name: biohub-cell-tracker
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=production
      - PORT=3009
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3009/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
