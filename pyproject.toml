[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celltracker"
version = "1.0.0"
description = "3D spatiotemporal cell tracker (Kalman + Hungarian + mitotic lineage) for the Biohub challenge"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["celltracker"]
